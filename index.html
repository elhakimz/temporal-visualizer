<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temporal workflow visualizer</title>
</head>
<body>
  <div id="app">
    <aside id="side" aria-label="Workflows">
      <div id="rail">
        <button id="expand" type="button" class="icon-btn" aria-label="Expand workflow list" aria-expanded="false" aria-controls="side-content">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        </button>
        <span id="rail-badge" class="chip-badge" data-n="1" hidden></span>
        <span id="rail-dot" hidden title="New workflow"></span>
        <span class="rail-label" aria-hidden="true">Workflows</span>
      </div>

      <div id="side-content">
        <div class="side-head">
          <div class="side-title">
            <h1>Workflows</h1>
            <button id="collapse" type="button" class="icon-btn" aria-label="Collapse workflow list" aria-expanded="true" aria-controls="side-content">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
            </button>
          </div>
          <label class="field"><span>Namespace</span><input id="ns" value="default" spellcheck="false" /></label>
          <label class="field"><span>Visibility query</span><input id="query" placeholder="WorkflowType = 'OrderWorkflow'" spellcheck="false" /></label>
          <div class="row">
            <button id="reload" type="button">Reload list</button>
            <button id="sample" type="button" class="quiet">Replay sample</button>
          </div>
        </div>
        <div id="filters" role="toolbar" aria-label="Filter workflows"></div>
        <div id="new-note" hidden></div>
        <ul id="list"></ul>
      </div>
      <div id="announce" class="sr-only" role="status" aria-live="polite"></div>

      <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize workflow list" tabindex="0"
           title="Drag to resize, double-click to reset"></div>
    </aside>

    <main id="main">
      <div id="bar">
        <div class="titles">
          <div class="title-row">
            <h2 id="wf-title">No workflow selected</h2>
            <span id="wf-status" class="chip" hidden></span>
          </div>
        </div>
        <div class="row">
          <span id="live" class="live" data-mode="idle" title="Live: new events arrive as they happen"><span class="live-dot"></span><span id="live-text">Not connected</span></span>
          <label class="check"><input id="auto" type="checkbox" checked /> Follow live</label>
          <button id="fit" type="button">Fit to view</button>
          <a id="open-ui" class="btn" target="_blank" rel="noopener noreferrer" hidden>Open in Temporal UI</a>
        </div>
        <div id="bar-sub">
          <div id="wf-ids" class="id-row"></div>
          <div id="wf-nav" class="nav-row" hidden></div>
        </div>
      </div>
      <div id="banner" role="alert" hidden></div>
      <div id="stage">
        <div id="canvas-wrap"><canvas id="c"></canvas></div>
        <div id="scrubber" hidden aria-label="Replay controls">
          <div class="sc-buttons">
            <button id="sc-prev" type="button" class="icon-btn" aria-label="Previous step" title="Previous step (Left arrow)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3L5 8l6 5"/></svg></button>
            <button id="sc-play" type="button" class="icon-btn sc-play" aria-label="Play" title="Play / pause (Space)"><svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l8 5-8 5z"/></svg><svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg></button>
            <button id="sc-next" type="button" class="icon-btn" aria-label="Next step" title="Next step (Right arrow)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l6 5-6 5"/></svg></button>
          </div>
          <div class="sc-main">
            <div class="sc-info"><span id="sc-step" class="sc-step"></span><span id="sc-what" class="sc-what"></span></div>
            <div class="sc-trackwrap">
              <canvas id="sc-track" tabindex="0" role="slider" aria-label="Replay position"></canvas>
              <div id="sc-tip" hidden></div>
            </div>
          </div>
          <div class="sc-opts">
            <button id="sc-speed" type="button" title="Playback speed">1×</button>
            <button id="sc-scale" type="button" aria-pressed="false" title="Space the steps by real time instead of evenly">Time scale</button>
            <button id="sc-end" type="button" title="Jump to the final state (End)">Final state</button>
          </div>
        </div>
        <div id="empty">
          <p>Pick a workflow on the left to see its steps.</p>
          <p class="hint">Nothing running yet? Start one against <code>localhost:7233</code>, or replay the built-in sample.</p>
        </div>
      </div>
    </main>

    <aside id="detail" aria-label="Details">
      <div id="detail-tabs" role="tablist" aria-label="Details panel">
        <button id="tab-details" type="button" role="tab" aria-selected="true" aria-controls="detail-body">Details</button>
        <button id="tab-failures" type="button" role="tab" aria-selected="false" aria-controls="detail-body">Failures <span id="fail-count" class="chip-badge" data-n="0">0</span></button>
      </div>
      <div id="detail-body" role="tabpanel"></div>
    </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
